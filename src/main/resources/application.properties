# Default (local) database settings.
#
# Every value here can be overridden at runtime by an environment variable,
# which is how the Docker and Jenkins environments inject their own settings.
# See com.hms.config.AppConfig for the resolution order.

db.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=hms_user
db.password=hms_password
db.driver=com.mysql.cj.jdbc.Driver

db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=10000
